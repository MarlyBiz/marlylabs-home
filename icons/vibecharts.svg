<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Grid Lines -->
  <line x1="80" y1="140" x2="432" y2="140" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" />
  <line x1="80" y1="240" x2="432" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" />
  <line x1="80" y1="340" x2="432" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Glowing Area Under Chart -->
  <path d="M 80 340 L 140 280 L 200 300 L 260 210 L 320 240 L 380 160 L 432 180 L 432 400 L 80 400 Z" fill="url(#chart-grad)" />
  
  <!-- Main Trend Line (Glow) -->
  <path d="M 80 340 L 140 280 L 200 300 L 260 210 L 320 240 L 380 160 L 432 180" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
  <path d="M 80 340 L 140 280 L 200 300 L 260 210 L 320 240 L 380 160 L 432 180" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Decorative Dots on vertices -->
  <circle cx="140" cy="280" r="10" fill="#34d399" />
  <circle cx="260" cy="210" r="10" fill="#34d399" />
  <circle cx="380" cy="160" r="12" fill="#60a5fa" />
  <circle cx="380" cy="160" r="6" fill="#ffffff" />
</svg>
